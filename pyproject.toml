[project]
name = "pi-in-py"
version = "0.1.0"
description = "A small Python agent harness for learning model loops, tools, and queues"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic==2.3.0",
    "filelock==4.2.4",
    "openai==3.37.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
]

[project.scripts]
pi-in-py = "pi_in_py.app.cli:main"

[build-system]
requires = ["uv_build==0.10.3"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
